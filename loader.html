<!-- Brand Vision custom code — edit and copy from this file.
Four sections, pasted into the four places marked below.
Keep existing tracking, metadata and other site/page code.

Designer uses the two real CSS links in Embed 1; it does not run Embed 2.
Published staging uses GitHub Pages, or localhost with ?bv-dev=1.
?bv-dev=0 exits local mode. Production uses pinned v1.1.1 assets.
For a new release, update both VER values and package.json together.
-->

<!-- START HEAD -->
<!-- Site settings → Custom code → Head code (asset portion only). -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<!-- END HEAD -->

<!-- START EMBED_CSS -->
<!-- Designer Embed 1: CSS only, shared near the top of every page. -->
<link id="bv-css" rel="stylesheet" href="https://brandvm.github.io/brandvm/styles.css?v=1" />
<link id="bv-css-dev" rel="stylesheet" href="http://localhost:3000/styles.css" />
<!-- END EMBED_CSS -->

<!-- START EMBED_CONFIG -->
<!-- Designer Embed 2: place immediately after Embed 1. Runs on published pages. -->
<script>
(function () {
  var VER = '1.1.1';
  var PROD_CSS = 'https://cdn.jsdelivr.net/gh/brandvm/brandvm@' + VER + '/dist/styles.css';
  var STAG = 'https://brandvm.github.io/brandvm/';
  var DEV = 'http://localhost:3000/';
  var staging = /\.webflow\.io$/.test(location.hostname) || /\.canvas\.webflow\.com$/.test(location.hostname);
  var flag = false;
  if (staging) {
    try {
      var value = new URLSearchParams(location.search).get('bv-dev');
      if (value !== null) {
        flag = value === '1';
        try { localStorage.setItem('bv-dev', value); } catch (e) {}
      } else flag = localStorage.getItem('bv-dev') === '1';
    } catch (e) {}
  }
  window.BV = { staging: staging, dev: flag, devBase: DEV, stag: STAG };
  var base = document.getElementById('bv-css');
  var dev = document.getElementById('bv-css-dev');
  if (base) base.href = staging ? STAG + 'styles.css?v=' + Date.now() : PROD_CSS;
  if (dev && !flag) dev.remove();
})();
</script>
<!-- END EMBED_CONFIG -->

<!-- START FOOTER -->
<!-- Site settings → Custom code → Footer code, before </body>. -->
<script>
(function () {
  if (window.__bvFooterStarted) return;
  window.__bvFooterStarted = true;
  var VER = '1.1.1';
  var PROD_JS = 'https://cdn.jsdelivr.net/gh/brandvm/brandvm@' + VER + '/dist/index.js';
  function js(src, fallback) {
    var s = document.createElement('script');
    s.src = src;
    if (fallback) s.onerror = fallback;
    document.head.appendChild(s);
  }
  var C = window.BV;
  if (!C) {
    console.warn('[bv] Configuration Embed missing; loading production JS only.');
    return js(PROD_JS);
  }
  var v = '?v=' + Date.now();
  function staging() {
    js(C.stag + 'index.js' + v, function () { js(PROD_JS); });
  }
  if (C.dev) js(C.devBase + 'index.js', staging);
  else if (C.staging) staging();
  else js(PROD_JS);
})();
</script>
<!-- END FOOTER -->
