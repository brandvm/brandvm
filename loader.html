<!-- Brand Vision custom-code integration — edit this file directly.
Three pieces, pasted into three different places in Webflow.
Do not paste this entire file into a single field.

1. HEAD: connection hints only. Keep existing tracking, metadata and styles.
2. EMBED: one shared CSS/config Embed near the top of every page.
3. FOOTER: starts the custom JavaScript download before </body>.

Production uses pinned v1.1.0 assets. For a new release, update package.json,
the stylesheet href, and both production configurations below together.
Never move an existing release tag. pnpm validate checks these versions.

Development: pnpm dev, then ?bv-dev=1 on *.webflow.io or on the actual
*.canvas.webflow.com preview frame. ?bv-dev=0 exits. The choice persists
per browser origin. Production ignores the flag.

Designer has a real released stylesheet. See README.md for a browser-only
local CSS override; do not publish an always-active localhost link.

Apply all three pieces together on staging before production. Remove the
previous bv-site-css head link and loadBrandVisionAssets head bootstrap;
replace the previous Designer link/cleanup and add the new footer loader.
Preserve other site/page code. No Webflow publication is automated.
-->

<!-- START HEAD -->
<!-- Site settings → Custom code → Head code (asset portion only). -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<!-- END HEAD -->

<!-- START EMBED -->
<!-- Shared on-canvas Embed: CSS + environment selection, once on every page. -->
<link id="bv-css" data-bv-css rel="stylesheet" href="https://cdn.jsdelivr.net/gh/brandvm/brandvm@1.1.0/dist/styles.css" />
<script>
// Shared Embed: select CSS early, but leave every JavaScript request to the footer.
function prepareBrandVisionStyles(config) {
  if (window.__bvAssets) return;
  var staging = /\.webflow\.io$/.test(location.hostname) || /\.canvas\.webflow\.com$/.test(location.hostname);
  var dev = false;
  if (staging) {
    try {
      var flag = new URLSearchParams(location.search).get('bv-dev');
      if (flag !== null) {
        dev = flag === '1';
        try { localStorage.setItem('bv-dev', flag); } catch (_) {}
      } else dev = localStorage.getItem('bv-dev') === '1';
    } catch (_) {}
  }
  var candidates = [];
  if (dev) candidates.push({ css: config.devBase + 'styles.css', js: config.devBase + 'index.js' });
  if (staging) {
    var stamp = '?v=' + Date.now();
    candidates.push({ css: config.stagingBase + 'styles.css' + stamp, js: config.stagingBase + 'index.js' + stamp });
  }
  candidates.push(config.production);
  var css = document.getElementById('bv-css');
  var state = window.__bvAssets = { candidates: candidates, select: select };
  state.ready = select(0);

  function select(index) {
    var candidate = candidates[index];
    if (!candidate) return Promise.resolve(-1);
    if (!css) {
      css = document.createElement('link');
      css.id = 'bv-css';
      css.rel = 'stylesheet';
      document.head.appendChild(css);
    }
    // The production link is real markup, already encountered before this script.
    // Do not put production JavaScript behind an extra CSS load-event dependency.
    if (css.getAttribute('href') === candidate.css) return Promise.resolve(index);
    return new Promise(function (resolve) {
      var settled = false;
      var timeout = setTimeout(function () { finish(false); }, 8000);
      function finish(ok) {
        if (settled) return;
        settled = true;
        clearTimeout(timeout);
        css.onload = css.onerror = null;
        resolve(ok ? index : select(index + 1));
      }
      css.onload = function () { finish(true); };
      css.onerror = function () { finish(false); };
      css.href = candidate.css;
    });
  }
}

prepareBrandVisionStyles({
  "production": {
    "version": "1.1.0",
    "js": "https://cdn.jsdelivr.net/gh/brandvm/brandvm@1.1.0/dist/index.js",
    "css": "https://cdn.jsdelivr.net/gh/brandvm/brandvm@1.1.0/dist/styles.css"
  },
  "stagingBase": "https://brandvm.github.io/brandvm/",
  "devBase": "http://localhost:3000/"
});
</script>
<!-- END EMBED -->

<!-- START FOOTER -->
<!-- Site settings → Custom code → Footer code, before </body>. -->
<script>
// Called only from Webflow's before-</body> custom code.
function loadBrandVisionScript(config) {
  if (window.__bvFooterStarted) return;
  window.__bvFooterStarted = true;
  var state = window.__bvAssets;
  if (!state) {
    console.warn('[Brand Vision] Shared CSS Embed missing; using production assets.');
    var css = document.getElementById('bv-css');
    if (!css) {
      css = document.createElement('link');
      css.id = 'bv-css';
      css.rel = 'stylesheet';
      css.href = config.production.css;
      document.head.appendChild(css);
    }
    return request(config.production.js);
  }
  state.ready.then(start);

  function start(index) {
    if (index < 0) {
      console.error('[Brand Vision] Custom assets could not be loaded.');
      return;
    }
    request(state.candidates[index].js, function () {
      state.ready = state.select(index + 1);
      state.ready.then(start);
    });
  }
  function request(src, fallback) {
    var script = document.createElement('script');
    script.src = src;
    script.async = true;
    script.onerror = function () {
      script.remove();
      if (fallback) fallback();
      else console.error('[Brand Vision] Production JavaScript could not be loaded.');
    };
    document.body.appendChild(script);
  }
}

loadBrandVisionScript({
  "production": {
    "version": "1.1.0",
    "js": "https://cdn.jsdelivr.net/gh/brandvm/brandvm@1.1.0/dist/index.js",
    "css": "https://cdn.jsdelivr.net/gh/brandvm/brandvm@1.1.0/dist/styles.css"
  },
  "stagingBase": "https://brandvm.github.io/brandvm/",
  "devBase": "http://localhost:3000/"
});
</script>
<!-- END FOOTER -->
